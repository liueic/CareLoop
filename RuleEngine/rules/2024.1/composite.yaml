ruleset:
  id: composite
  version: "2024.1.0"
  disease_category: composite
  standard_profile: CN-2023
  status: active
  effective_date: "2024-06-01"
  sources:
    - source_id: CVD-PREV-2020
      org_cn: 中华医学会心血管病学分会
      org_en: Chinese Society of Cardiology
      title: 中国心血管病一级预防指南（2020）
      year: 2020
      publisher: 中华心血管病杂志
    - source_id: CDS-2004
      org_cn: 中华医学会糖尿病学分会
      org_en: Chinese Diabetes Society
      title: 代谢综合征定义与诊断标准（CDS 2004）
      year: 2004
    - source_id: CLG-2023
      org_cn: 中国血脂管理指南修订委员会
      org_en: Chinese Blood Lipid Management Guideline Revision Committee
      title: 中国血脂管理指南（2023年）
      year: 2023

  rules:
    # 代谢综合征筛查
    - id: CMP-MS-001
      name:
        cn: 代谢综合征筛查
        en: Metabolic Syndrome Screening
      type: composite
      priority: 100
      enabled: true
      inputs:
        required: [waist, tg, hdl_c, sbp, blood_glucose]
      note: "CDS 2004标准：5项中≥3项即为代谢综合征。腰围：男≥90cm/女≥85cm；TG≥1.7；HDL-C<1.04；BP≥130/85；FPG≥6.1"
      evidence:
        - source_id: CDS-2004
          section: "代谢综合征诊断标准"
          quote: "具备以下3项或全部者：腰围超标、TG升高、HDL-C降低、血压升高、空腹血糖升高"
      confidence: high
      advice_ids: [AD-CMP-101]

    # ASCVD风险因子计数
    - id: CMP-ASCVD-001
      name:
        cn: ASCVD风险因子计数
        en: ASCVD Risk Factor Counting
      type: composite
      priority: 90
      enabled: true
      inputs:
        required: [ldl_c, sbp]
      note: "China-PAR 10年ASCVD风险模型主要危险因素：年龄（男≥45/女≥55）、吸烟、低HDL-C、高LDL-C、高血压、糖尿病"
      evidence:
        - source_id: CVD-PREV-2020
          section: "第3章 ASCVD风险评估, China-PAR模型"
          quote: "多项危险因素聚集显著增加ASCVD 10年风险"
      confidence: medium
      advice_ids: [AD-CMP-101, AD-CMP-102]

    # 高血压×糖尿病风险升级
    - id: CMP-ESC-001
      name:
        cn: 高血压合并血糖异常风险升级
        en: Hypertension × Diabetes Risk Escalation
      type: composite
      priority: 95
      enabled: true
      inputs:
        required: [sbp, blood_glucose]
      note: "高血压合并糖尿病患者ASCVD风险显著升高，需更严格的血压和血糖控制目标"
      evidence:
        - source_id: CVD-PREV-2020
          section: "高血压合并糖尿病管理"
          quote: "高血压合并糖尿病患者ASCVD风险显著升高，血压目标<130/80mmHg，LDL-C目标<1.8mmol/L"
      confidence: high
      advice_ids: [AD-CMP-101, AD-CMP-103]

    # OSA筛查
    - id: CMP-OSA-001
      name:
        cn: 阻塞性睡眠呼吸暂停筛查
        en: Obstructive Sleep Apnea Screening
      type: composite
      priority: 80
      enabled: true
      inputs:
        required: [spo2_night_min, sbp]
      note: "夜间SpO2最低值<90%合并血压升高提示OSA可能"
      evidence:
        - source_id: CVD-PREV-2020
          section: "OSA与心血管风险"
          quote: "OSA是高血压的独立危险因素，夜间SpO2<90%需筛查OSA"
      confidence: medium
      advice_ids: [AD-SLP-102]

    # LDL-C极高×高血压
    - id: CMP-LDL-ESC-001
      name:
        cn: 极高LDL-C合并高血压
        en: Extreme LDL-C with Hypertension
      type: composite
      priority: 98
      enabled: true
      inputs:
        required: [ldl_c, sbp]
      note: "LDL-C≥4.9为高危标志，合并高血压时心血管风险极高"
      evidence:
        - source_id: CLG-2023
          section: "血脂异常危险分层"
          quote: "LDL-C≥4.9mmol/L为高危标志，合并高血压时心血管风险极高"
      confidence: high
      advice_ids: [AD-LIP-103, AD-CMP-103]
