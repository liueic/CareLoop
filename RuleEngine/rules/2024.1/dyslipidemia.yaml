ruleset:
  id: dyslipidemia
  version: "2024.1.0"
  disease_category: dyslipidemia
  standard_profile: CN-2023
  status: active
  effective_date: "2024-06-01"
  sources:
    - source_id: CLG-2023
      org_cn: 中国血脂管理指南修订联合委员会
      org_en: Chinese Blood Lipid Management Guideline Revision Joint Committee
      title: 中国血脂管理指南（2023年）
      year: 2023
      publisher: 中国循环杂志

  rules:
    # 总胆固醇评估
    - id: LIP-SP-001
      name:
        cn: 总胆固醇分级
        en: Total Cholesterol Grading
      type: single_point
      priority: 100
      enabled: true
      inputs:
        required: [tc]
        unit_requirements: {tc: mmol/L}
      conditions:
        any:
          - all: {tc: {gte: 6.2}}
            output_risk: high
            tag: high_tc
          - all: {tc: {gte: 5.2, lt: 6.2}}
            output_risk: low_elevated
            tag: borderline_high_tc
          - all: {tc: {lt: 5.2}}
            output_risk: normal
            tag: normal_tc
        default_risk: normal
      evidence:
        - source_id: CLG-2023
          section: "第3章 血脂异常分类与诊断"
          quote: "总胆固醇<5.2 mmol/L为合适水平；5.2-6.1为边缘升高；≥6.2为升高"
      confidence: high
      advice_ids: [AD-LIP-101, AD-LIP-102]

    # LDL-C评估
    - id: LIP-SP-002
      name:
        cn: 低密度脂蛋白胆固醇分级
        en: LDL Cholesterol Grading
      type: single_point
      priority: 95
      enabled: true
      inputs:
        required: [ldl_c]
        unit_requirements: {ldl_c: mmol/L}
      conditions:
        any:
          - all: {ldl_c: {gte: 4.9}}
            output_risk: high
            tag: very_high_ldl
          - all: {ldl_c: {gte: 4.1, lt: 4.9}}
            output_risk: medium
            tag: high_ldl
          - all: {ldl_c: {gte: 3.4, lt: 4.1}}
            output_risk: low_elevated
            tag: borderline_high_ldl
          - all: {ldl_c: {lt: 3.4}}
            output_risk: normal
            tag: normal_ldl
        default_risk: normal
      evidence:
        - source_id: CLG-2023
          section: "第3章 血脂异常分类与诊断"
          quote: "LDL-C<3.4 mmol/L为合适水平；3.4-4.0为边缘升高；≥4.1为升高"
      confidence: high
      advice_ids: [AD-LIP-101, AD-LIP-102]

    # HDL-C评估（低HDL为风险因子）
    - id: LIP-SP-003
      name:
        cn: 高密度脂蛋白胆固醇评估
        en: HDL Cholesterol Assessment
      type: single_point
      priority: 90
      enabled: true
      inputs:
        required: [hdl_c]
        unit_requirements: {hdl_c: mmol/L}
      conditions:
        any:
          - all: {hdl_c: {lt: 1.0}}
            output_risk: medium
            tag: low_hdl
          - all: {hdl_c: {gte: 1.0}}
            output_risk: normal
            tag: normal_hdl
        default_risk: normal
      evidence:
        - source_id: CLG-2023
          section: "第3章 血脂异常分类与诊断"
          quote: "HDL-C<1.0 mmol/L为降低，是心血管疾病独立风险因子"
      confidence: high
      advice_ids: [AD-LIP-101]

    # 甘油三酯评估
    - id: LIP-SP-004
      name:
        cn: 甘油三酯分级
        en: Triglycerides Grading
      type: single_point
      priority: 85
      enabled: true
      inputs:
        required: [tg]
        unit_requirements: {tg: mmol/L}
      conditions:
        any:
          - all: {tg: {gte: 5.65}}
            output_risk: urgent
            tag: very_high_tg_pancreatitis_risk
          - all: {tg: {gte: 2.3, lt: 5.65}}
            output_risk: high
            tag: high_tg
          - all: {tg: {gte: 1.7, lt: 2.3}}
            output_risk: low_elevated
            tag: borderline_high_tg
          - all: {tg: {lt: 1.7}}
            output_risk: normal
            tag: normal_tg
        default_risk: normal
      evidence:
        - source_id: CLG-2023
          section: "第3章 血脂异常分类与诊断"
          quote: "甘油三酯<1.7 mmol/L为合适水平；1.7-2.25为边缘升高；≥2.3为升高；≥5.65为极高，有胰腺炎风险"
      confidence: high
      advice_ids: [AD-LIP-101, AD-LIP-102]
