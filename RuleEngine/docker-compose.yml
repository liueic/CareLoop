services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HRE_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/health_rule_engine
      - HRE_REDIS_URL=redis://redis:6379/0
      - HRE_RULES_DIR=/app/rules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./rules:/app/rules:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: health_rule_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
